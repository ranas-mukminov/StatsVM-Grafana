name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose files
        run: |
          docker-compose config > /dev/null
          docker-compose -f docker-compose.dev.yml config > /dev/null
          docker-compose -f docker-compose.prod.yml config > /dev/null

      - name: Validate Prometheus config
        run: |
          docker run --rm -v $(pwd)/prometheus:/prometheus prom/prometheus:latest \
            promtool check config /prometheus/prometheus.yml

      - name: Validate Prometheus rules
        run: |
          docker run --rm -v $(pwd)/prometheus:/prometheus prom/prometheus:latest \
            promtool check rules /prometheus/alerts/monitoring.yml

  test:
    name: Test Stack Deployment
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start monitoring stack
        run: |
          docker-compose up -d
          sleep 30

      - name: Check service health
        run: |
          curl -f http://localhost:3000/api/health || exit 1
          curl -f http://localhost:9090/-/healthy || exit 1
          curl -f http://localhost:3100/ready || exit 1
          curl -f http://localhost:9093/-/healthy || exit 1

      - name: Run integration tests
        run: |
          chmod +x scripts/test.sh
          ./scripts/test.sh

      - name: Show logs on failure
        if: failure()
        run: |
          docker-compose logs

      - name: Stop monitoring stack
        if: always()
        run: |
          docker-compose down -v

  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: monitoring-stack
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-

      # Uncomment if you have custom Docker images to build
      # - name: Build and push Docker image
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     push: ${{ github.event_name != 'pull_request' }}
      #     tags: ${{ steps.meta.outputs.tags }}
      #     labels: ${{ steps.meta.outputs.labels }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
