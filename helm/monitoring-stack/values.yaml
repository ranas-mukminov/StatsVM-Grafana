# Default values for monitoring-stack

namespace: monitoring

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: latest
    pullPolicy: IfNotPresent
  
  replicas: 1
  
  service:
    type: ClusterIP
    port: 3000
  
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: grafana.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  
  adminPassword: admin
  
  persistence:
    enabled: true
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  
  replicas: 1
  
  service:
    type: ClusterIP
    port: 9090
  
  retention: 30d
  
  persistence:
    enabled: true
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 50Gi
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "2Gi"
      cpu: "1000m"

loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: latest
    pullPolicy: IfNotPresent
  
  replicas: 1
  
  service:
    type: ClusterIP
    port: 3100
  
  persistence:
    enabled: true
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 10Gi
  
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: latest
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: latest
    pullPolicy: IfNotPresent
  
  service:
    type: ClusterIP
    port: 9100
  
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

alertmanager:
  enabled: true
  image:
    repository: prom/alertmanager
    tag: latest
    pullPolicy: IfNotPresent
  
  replicas: 1
  
  service:
    type: ClusterIP
    port: 9093
  
  persistence:
    enabled: true
    storageClassName: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  
  resources:
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
