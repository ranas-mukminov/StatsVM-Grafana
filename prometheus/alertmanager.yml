global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
    - match:
        severity: warning
      receiver: 'warning'

receivers:
  - name: 'default'
    # Add your notification channels here
    # Examples:
    # webhook_configs:
    #   - url: 'http://example.com/webhook'
    # email_configs:
    #   - to: 'alerts@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'

  - name: 'critical'
    # Add critical alert channels here
    # webhook_configs:
    #   - url: 'http://example.com/critical-webhook'

  - name: 'warning'
    # Add warning alert channels here
    # webhook_configs:
    #   - url: 'http://example.com/warning-webhook'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
